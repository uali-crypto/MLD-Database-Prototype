<!DOCTYPE html>
<html lang="en">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data | MLD Database</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
  <main>
    
<div class="data-page">
  <h1>Data</h1>

  <div class="process-toggle">
    <button id="toggle-hybrid" class="toggle-btn active">Hybrid MLD</button>
    <button id="toggle-organic" class="toggle-btn">All-Organic MLD</button>
  </div>

  <div class="chart-container">
    <img id="chart-hybrid" src="/images/periodic-table-chart.png"
         alt="Hybrid MLD precursor periodic table" class="chart-image">
    <img id="chart-organic" src="/images/all-organic-chart.png"
         alt="All-organic MLD electrophile/nucleophile chart"
         class="chart-image" style="display: none;">
  </div>

  <div class="table-controls">
    <button id="toggle-columns" class="toggle-btn">Show More Columns</button>
    <button id="clear-filters" class="toggle-btn">Clear All Filters</button>
  </div>

  <div id="data-table"></div>
</div>

<link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
<link rel="stylesheet" href="/css/data-page.css">
<script src="/js/data-page.js"></script>

  </main>
</body>
</html>
